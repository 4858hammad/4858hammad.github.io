# Solution diagrams for the project banners and link-preview images.
# Rendered by tools/build_visuals.py into:
#   assets/images/projects/<id>.png      (1200x400 banner, saved at 2x)
#   assets/images/og/<id>.png            (1200x630 social preview)
#
# Every label here comes from that project's entry in portfolio_data.yaml.
# Keep it that way: a diagram is a claim, so only draw what you actually built.
#
# flow:   4-6 steps, left to right. kind = user | ext | odoo | out
#           user = a person, ext = a system outside Odoo,
#           odoo = something you built inside Odoo, out = the result
#         `items` turns a step into a small stack (e.g. three lead sources).
# links:  one per gap between steps: "->" (one way) or "<->" (two way),
#         optional `label` shown on the arrow. Omit for plain "->".
# facts:  2-3 short proof points, shown on the link-preview image.

